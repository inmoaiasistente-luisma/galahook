<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Passenger details — Galápagos Hook Adventure</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  body{background:#0c2322;color:var(--paper);}
  .pf-wrap{position:relative;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px 48px;}
  .pf-top{position:relative;z-index:1;align-self:flex-start;display:flex;align-items:center;gap:12px;margin:6px 0 18px;}
  .pf-top .brand-badge{width:48px;height:48px;}
  .pf-top b{font-family:var(--display);font-size:16px;color:var(--paper);}
  .pf-wrap .brand-watermark img{opacity:.06;}
  #pfRoot{position:relative;z-index:1;width:100%;max-width:640px;}
  .pf-card{width:100%;background:rgba(255,255,255,.05);border:1px solid var(--line-on-dark);border-radius:14px;padding:20px;margin-bottom:16px;}
  .pf-h{font-family:var(--display);font-size:20px;font-weight:700;margin:0 0 4px;}
  .pf-sub{color:rgba(255,255,255,.62);font-size:14px;line-height:1.5;margin:0 0 14px;}
  .pf-sec-h{font-family:var(--display);font-size:17px;font-weight:700;margin:0 0 3px;color:var(--gold-soft);}
  .pf-note{font-size:12.5px;color:rgba(255,255,255,.6);line-height:1.45;margin:0 0 12px;}
  .pf-recap{display:flex;flex-wrap:wrap;gap:8px 22px;margin:0 0 6px;}
  .pf-recap div{font-size:14px;}
  .pf-recap span{display:block;color:rgba(255,255,255,.5);font-size:11px;text-transform:uppercase;letter-spacing:.06em;}
  .pf-recap b{font-weight:700;}
  .pf-field{margin-bottom:12px;}
  .pf-field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:rgba(255,255,255,.66);margin-bottom:5px;}
  .pf-field input,.pf-field select,.pf-field textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--line-on-dark);color:var(--paper);border-radius:8px;padding:11px 12px;font-size:15px;font-family:inherit;}
  .pf-field textarea{min-height:60px;resize:vertical;}
  .pf-field input::placeholder,.pf-field textarea::placeholder{color:rgba(255,255,255,.4);}
  .pf-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .pf-pax{border:1px solid var(--line-on-dark);border-radius:12px;padding:16px;margin-bottom:14px;background:rgba(255,255,255,.03);}
  .pf-pax-h{font-weight:700;font-size:15px;margin:0 0 12px;color:var(--gold-soft);}
  .pf-check{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;color:var(--paper);margin:2px 0 12px;cursor:pointer;}
  .pf-check input{width:20px;height:20px;flex:0 0 auto;margin-top:1px;}
  .pf-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:8px;}
  .pf-actions .btn{flex:1;min-width:150px;}
  .pf-msg{border-radius:8px;padding:11px 14px;font-size:14px;margin-bottom:14px;display:none;}
  .pf-msg.show{display:block;}
  .pf-msg.err{background:#fbe7e3;color:#9a2b16;}
  .pf-msg.ok{background:rgba(90,160,120,.22);color:#bfe8cf;border:1px solid rgba(90,160,120,.5);}
  .pf-hint{font-size:12px;color:rgba(255,255,255,.5);margin-top:4px;}
  .pf-muted{color:rgba(255,255,255,.6);text-align:center;font-size:14px;padding:26px 0;}
  .pf-ro{background:rgba(207,159,84,.12);border:1px solid rgba(207,159,84,.35);border-radius:10px;padding:12px 14px;font-size:14px;margin-bottom:14px;}
  @media(max-width:520px){ .pf-row{grid-template-columns:1fr;} }
</style>
</head>
<body>
<div class="pf-wrap">
  <div class="brand-watermark" aria-hidden="true"><img src="assets/img/logo.png" alt=""></div>
  <div class="pf-top"><span class="brand-badge"><img src="assets/img/logo.png" alt=""></span><b>Hook Adventure · Passengers</b></div>
  <div id="pfRoot"></div>
</div>
<script src="assets/js/passengers.js"></script>
</body>
</html>
