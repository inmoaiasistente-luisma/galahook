<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- El acceso admin se protege con el login seguro (sesión server-side); no se usa el gate ghk_lock. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Galápagos Hook Adventure</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  /* =========================================================
     FASE 9 — Tema admin claro (identidad Galápagos Hook Adventure)
     Tokens admin-scoped (--a-*) derivados de la paleta de marca de site.css.
     NO se toca site.css (sitio público). Fondo crema, sidebar verde oscuro,
     tarjetas claras, botones dorados con texto verde, bordes arena suave,
     estados suaves (verde/amarillo/rojo-solo-alerta/azul info). Sin rojo primario.
     ========================================================= */
  :root{
    --a-bg:#f4efe3;            /* fondo crema/arena */
    --a-bg-2:#efe8d8;          /* arena alterna */
    --a-sidebar:#0d2b2a;       /* sidebar verde oscuro */
    --a-sidebar-2:#08201f;     /* topbar verde más oscuro */
    --a-card:#fbf8f1;          /* tarjeta blanco cálido/crema muy claro */
    --a-card-2:#ffffff;        /* superficie nítida (tablas) */
    --a-text:#11302f;          /* texto principal verde oscuro */
    --a-text-soft:#3c534f;     /* texto secundario */
    --a-text-mut:#6b7d78;      /* texto muy tenue */
    --a-gold:#cf9f54;          /* botones dorado/amarillo */
    --a-gold-deep:#9a7328;     /* dorado oscuro (texto sobre claro) */
    --a-border:rgba(17,48,47,.13);   /* borde/divisor arena suave */
    --a-border-2:#e7dcc4;      /* divisor arena algo más cálido */
    --a-shadow:0 8px 24px -14px rgba(8,32,31,.28);
    --a-shadow-sm:0 4px 14px -10px rgba(8,32,31,.24);
    /* estados suaves */
    --a-ok-bg:rgba(31,138,91,.14); --a-ok-tx:#1c7a4e; --a-ok-bd:rgba(31,138,91,.32);
    --a-pend-bg:rgba(207,159,84,.20); --a-pend-tx:#8a6320; --a-pend-bd:rgba(207,159,84,.5);
    --a-bad-bg:rgba(193,58,42,.12); --a-bad-tx:#b23a2a; --a-bad-bd:rgba(193,58,42,.32);
    --a-info-bg:rgba(28,122,130,.12); --a-info-tx:#16636a; --a-info-bd:rgba(28,122,130,.32);
    --a-mut-bg:rgba(17,48,47,.07); --a-mut-tx:#3c534f; --a-mut-bd:rgba(17,48,47,.14);
  }
  body{background:var(--a-bg);color:var(--a-text);}
  .admin-shell{min-height:100vh;display:flex;flex-direction:column;}
  /* login */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:linear-gradient(rgba(8,32,31,.82),rgba(8,32,31,.92)),url(assets/img/kicker-sunrise.jpg);background-size:cover;background-position:center;}
  .login-card{width:100%;max-width:400px;background:var(--paper);border-radius:14px;padding:40px 34px;box-shadow:var(--shadow);}
  .login-card img{height:84px;margin:0 auto 18px;display:block;}
  .login-card h1{font-size:24px;text-align:center;margin-bottom:6px;}
  .login-card p{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:24px;}
  .err{background:#fbe7e3;color:#9a2b16;border-radius:6px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:none;}
  .err.show{display:block;}
  /* topbar (verde oscuro, cohesivo con el sidebar) */
  .admin-top{position:sticky;top:0;z-index:50;background:var(--a-sidebar-2);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;box-shadow:0 1px 0 var(--line-on-dark);}
  .admin-top .brand-mini{display:flex;align-items:center;gap:11px;}
  .admin-top img{height:36px;}
  .admin-top b{font-family:var(--display);font-weight:800;font-size:15px;}
  .admin-top .actions{display:flex;gap:10px;align-items:center;}
  .save-state{font-size:12.5px;color:var(--gold-soft);opacity:0;transition:.3s;}
  .save-state.show{opacity:1;}
  /* layout */
  .admin-body{flex:1;display:grid;grid-template-columns:236px 1fr;align-items:start;}
  .admin-nav{position:sticky;top:60px;background:var(--a-sidebar);min-height:calc(100vh - 60px);padding:22px 14px;display:flex;flex-direction:column;gap:3px;}
  .admin-nav button{display:flex;align-items:center;gap:11px;text-align:left;color:rgba(255,255,255,.74);font-family:var(--body);font-weight:600;font-size:14.5px;padding:11px 14px;border-radius:9px;transition:.25s;width:100%;}
  .admin-nav button:hover{background:rgba(255,255,255,.07);color:#fff;}
  .admin-nav button.active{background:var(--a-gold);color:var(--a-sidebar-2);font-weight:700;}
  /* encabezado de grupo del sidebar (Fase 9: navegación agrupada) */
  .nav-group{font-size:10.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.42);padding:16px 14px 6px;}
  .nav-group:first-child{padding-top:2px;}
  .admin-main{padding:32px clamp(18px,3.5vw,44px);max-width:1220px;width:100%;}
  .panel{display:none;}
  .panel.active{display:block;}
  .panel-anim{animation:fade .4s var(--ease) both;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .panel h2{font-size:29px;margin-bottom:6px;color:var(--a-text);}
  .admin-main h2{color:var(--a-text);}
  .panel .sub{color:var(--a-text-soft);margin-bottom:26px;font-size:15px;}
  /* cards & fields (claro) */
  .ed-card{background:var(--a-card);border:1px solid var(--a-border);border-radius:14px;padding:22px 24px;margin-bottom:18px;box-shadow:var(--a-shadow-sm);}
  .ed-card h3{color:var(--a-text);font-family:var(--body);font-weight:700;font-size:17px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .ed-card .hint{color:var(--a-text-soft);font-size:13px;margin-bottom:16px;}
  .ed-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .ed-field{margin-bottom:14px;}
  .ed-field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--a-text-soft);margin-bottom:6px;}
  .ed-field input,.ed-field textarea,.ed-field select{width:100%;padding:11px 13px;border:1.5px solid var(--a-border);border-radius:8px;background:var(--a-card-2);color:var(--a-text);font-family:var(--body);font-size:14.5px;}
  /* <select> con fondo/menu OPACO claro (evita blanco-sobre-blanco en Windows). */
  .ed-field select{background-color:var(--a-card-2);background-image:none;}
  .ed-field input:focus,.ed-field textarea:focus,.ed-field select:focus{outline:none;border-color:var(--a-gold);box-shadow:0 0 0 3px rgba(207,159,84,.18);}
  .ed-field select:disabled{opacity:.7;color:var(--a-text-soft);}
  .ed-field select option{background-color:var(--a-card-2);color:var(--a-text);}
  .ed-field ::placeholder{color:var(--a-text-mut);}
  .ed-field textarea{resize:vertical;min-height:72px;}
  .price-in{display:flex;align-items:center;gap:8px;}
  .price-in span{color:var(--a-gold-deep);font-weight:700;}
  .img-edit{display:flex;gap:14px;align-items:center;}
  .img-edit .thumb{width:96px;height:72px;border-radius:8px;object-fit:cover;background:var(--a-bg-2) center/cover;flex-shrink:0;border:1px solid var(--a-border);}
  .img-edit .img-actions{flex:1;display:flex;flex-direction:column;gap:8px;}
  .mini-btn{font-size:12.5px;font-weight:700;letter-spacing:.04em;padding:8px 14px;border-radius:7px;background:var(--a-mut-bg);color:var(--a-text);border:1px solid var(--a-border);transition:.25s;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .mini-btn:hover{background:rgba(17,48,47,.12);}
  .mini-btn.danger{background:var(--a-bad-bg);color:var(--a-bad-tx);border-color:var(--a-bad-bd);}
  .mini-btn.danger:hover{background:rgba(193,58,42,.2);}
  /* En la topbar verde oscuro los mini-btn deben verse claros. */
  .admin-top .mini-btn{background:rgba(255,255,255,.1);color:var(--paper);border-color:var(--line-on-dark);}
  .admin-top .mini-btn:hover{background:rgba(255,255,255,.18);}
  .admin-top .mini-btn.danger{background:rgba(200,70,50,.24);color:#ffb3a3;border-color:rgba(200,70,50,.4);}
  .lang-mini{display:inline-flex;border:1px solid var(--line-on-dark);border-radius:6px;overflow:hidden;}
  .lang-mini button{font-size:12px;font-weight:800;letter-spacing:.05em;padding:7px 11px;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;transition:.2s;border:0;line-height:1;}
  .lang-mini button:hover{color:var(--paper);background:rgba(255,255,255,.08);}
  .lang-mini button.on{background:var(--a-gold);color:var(--a-sidebar-2);}
  .lang-mini button.on:hover{background:var(--a-gold);}
  .list-item{position:relative;}
  .item-head{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;}
  .add-btn{width:100%;border:1.5px dashed var(--a-border-2);border-radius:10px;padding:16px;color:var(--a-gold-deep);font-weight:700;letter-spacing:.04em;transition:.25s;background:transparent;}
  .add-btn:hover{background:var(--a-bg-2);border-color:var(--a-gold);}
  .inc-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .inc-row input{flex:1;}
  /* ---------- Reservas: resumen, calendario, tabla, detalle ---------- */
  .bk-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .bk-chip{display:inline-flex;align-items:baseline;gap:7px;background:var(--a-card);border:1px solid var(--a-border);
    border-radius:30px;padding:6px 14px;font-size:13px;color:var(--a-text-soft);box-shadow:var(--a-shadow-sm);}
  .bk-chip i{font-style:normal;opacity:.7;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;}
  .bk-chip b{color:var(--a-text);font-size:14px;font-weight:700;}
  /* tira financiera (solo owner/admin) */
  .bk-fin{align-items:center;padding:10px 12px;border:1px solid var(--a-pend-bd);border-radius:12px;
    background:var(--a-pend-bg);margin-bottom:16px;}
  .bk-fin:empty{display:none;}
  .bk-fin-lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--a-gold-deep);
    align-self:center;margin-right:4px;}
  .bk-meth{font-size:10px;color:var(--a-text-mut);text-transform:uppercase;letter-spacing:.04em;}
  /* ---- Módulo Finanzas ---- */
  .fin-filters{margin-bottom:14px;}
  .fin-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-bottom:16px;}
  .fin-tile{background:var(--a-card);border:1px solid var(--a-border);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--a-shadow-sm);}
  .fin-tile span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--a-text-soft);}
  .fin-tile b{font-size:21px;color:var(--a-text);}
  .fin-tile.strong{border-color:var(--a-pend-bd);background:var(--a-pend-bg);}
  .fin-tile.strong b{color:var(--a-gold-deep);}
  .fin-tile.warn b{color:var(--a-gold-deep);}
  .fin-partial{background:var(--a-pend-bg);border:1px solid var(--a-pend-bd);color:var(--a-pend-tx);border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:14px;}
  .fin-sec{margin-top:26px;}
  .fin-sec h3{color:var(--a-text);font-size:18px;margin-bottom:4px;}
  .fin-sec h4{color:var(--a-text);font-size:15px;margin:14px 0 8px;}
  .fin-tourtable{margin-top:4px;}
  .bk-form-err{color:var(--a-bad-tx);font-size:13px;}
  /* ---- badges de estado (estados suaves; rojo solo para alertas) ---- */
  .notif-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px;text-transform:uppercase;line-height:1.4;border:1px solid transparent;}
  .notif-sent{background:var(--a-ok-bg);color:var(--a-ok-tx);border-color:var(--a-ok-bd);}
  .notif-failed{background:var(--a-bad-bg);color:var(--a-bad-tx);border-color:var(--a-bad-bd);}
  .notif-pending{background:var(--a-pend-bg);color:var(--a-pend-tx);border-color:var(--a-pend-bd);}
  .notif-sending{background:var(--a-info-bg);color:var(--a-info-tx);border-color:var(--a-info-bd);}
  .notif-skipped{background:var(--a-mut-bg);color:var(--a-mut-tx);border-color:var(--a-mut-bd);}
  .notif-test{background:var(--a-pend-bg);color:var(--a-pend-tx);border-color:var(--a-pend-bd);}
  .notif-archived{background:var(--a-mut-bg);color:var(--a-text-mut);border-color:var(--a-mut-bd);}
  .td-hint{color:var(--a-text-soft);font-size:13.5px;margin-bottom:12px;}
  .td-warn{line-height:1.5;}
  .td-danger{background:var(--a-bad-bg);color:var(--a-bad-tx);border-color:var(--a-bad-bd);}
  .td-danger:hover{background:rgba(193,58,42,.2);}
  .bk-table tr.td-arch td{opacity:.5;}
  .nf-actions{display:flex;gap:6px;flex-wrap:wrap;}
  /* bloques QR y notificaciones en el detalle (owner/admin) */
  .bk-sub{margin-top:20px;padding-top:16px;border-top:1px solid var(--a-border);}
  .bk-sub h4{color:var(--a-text);font-family:var(--body);font-weight:700;font-size:14px;margin-bottom:4px;}
  .bk-sub-hint{color:var(--a-text-soft);font-size:12.5px;line-height:1.5;margin-bottom:12px;}
  .bk-sub-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;}
  .bk-sub-msg{font-size:12.5px;line-height:1.5;margin-top:10px;}
  .bk-sub-msg.warn{color:var(--a-gold-deep);} .bk-sub-msg.err{color:var(--a-bad-tx);}
  .bk-qr-img{text-align:center;}
  .bk-qr-img img{width:190px;max-width:60%;height:auto;background:#fff;border-radius:10px;padding:8px;border:1px solid var(--a-border);}
  .bk-qr-url{font-size:10.5px;color:var(--a-text-mut);word-break:break-all;margin-top:8px;}
  .bk-notifs{display:flex;flex-direction:column;gap:8px;}
  .bk-notif{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--a-card-2);
    border:1px solid var(--a-border);border-radius:8px;padding:10px 12px;}
  .bk-notif-main{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px;}
  .bk-notif-main b{font-size:12.5px;color:var(--a-text);font-weight:700;word-break:break-word;}
  .bk-notif-main small{font-size:11px;color:var(--a-text-soft);}
  /* calendario */
  .bk-cal{background:var(--a-card);border:1px solid var(--a-border);border-radius:14px;padding:16px;margin-bottom:18px;box-shadow:var(--a-shadow-sm);}
  .bk-cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .bk-cal-title{color:var(--a-text);font-family:var(--display);font-size:18px;text-transform:capitalize;}
  .bk-cal-nav{display:flex;gap:6px;}
  .bk-cal-dow,.bk-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .bk-cal-dow{margin-bottom:5px;}
  .bk-cal-dow span{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--a-text-mut);}
  .bk-cal-day{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:66px;padding:6px 7px;border-radius:9px;
    background:var(--a-card-2);border:1px solid var(--a-border);color:var(--a-text);text-align:left;transition:.18s;cursor:pointer;overflow:hidden;}
  .bk-cal-day:hover{background:var(--a-bg-2);}
  .bk-cal-day .d{font-weight:700;font-size:13px;color:var(--a-text);}
  .bk-cal-day .c{font-size:10.5px;line-height:1.25;color:var(--a-ok-tx);white-space:nowrap;font-weight:600;}
  .bk-cal-day .c.q{color:var(--a-info-tx);}
  .bk-cal-day.out{opacity:.4;}
  .bk-cal-day.today{border-color:var(--a-gold);box-shadow:0 0 0 1px var(--a-gold) inset;}
  .bk-cal-day.sel{background:var(--a-gold);border-color:var(--a-gold);}
  .bk-cal-day.sel .d,.bk-cal-day.sel .c{color:var(--a-sidebar-2);}
  /* filtros */
  .bk-filters{background:var(--a-card);border:1px solid var(--a-border);border-radius:14px;padding:16px 16px 6px;margin-bottom:14px;box-shadow:var(--a-shadow-sm);}
  .bk-frow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .bk-frow:first-child{grid-template-columns:2fr 1fr 1fr;}
  .bk-fbtns{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px;}
  .bk-tbl-title{color:var(--a-text);font-family:var(--display);font-weight:700;font-size:16px;margin:0 2px 10px;text-transform:capitalize;}
  /* tabla compacta (clara, limpia) */
  /* Desktop: la tabla ocupa todo el ancho y NO hay scroll horizontal (solo
     vertical para la cabecera fija). En móvil/tablet pequeño sí se permite. */
  .bk-table-wrap{border:1px solid var(--a-border);border-radius:14px;overflow-x:hidden;overflow-y:auto;max-height:64vh;background:var(--a-card-2);box-shadow:var(--a-shadow-sm);}
  table.bk-table{width:100%;border-collapse:collapse;font-size:13.5px;table-layout:fixed;}
  table.bk-table thead th{position:sticky;top:0;z-index:2;background:var(--a-bg-2);color:var(--a-text-soft);
    font-weight:700;font-size:11px;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:12px 14px;white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--a-border);}
  table.bk-table tbody td{padding:0 14px;height:48px;color:var(--a-text);border-bottom:1px solid var(--a-border);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  table.bk-table tbody tr:last-child td{border-bottom:0;}
  table.bk-table tbody tr:nth-child(even){background:rgba(17,48,47,.018);}
  table.bk-table tbody tr:hover{background:var(--a-bg-2);cursor:pointer;}
  table.bk-table td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--a-gold-deep);font-weight:700;}
  table.bk-table td.num{text-align:right;}
  table.bk-table td.ell{max-width:190px;overflow:hidden;text-overflow:ellipsis;}
  table.bk-table td.bk-empty{text-align:center;color:var(--a-text-soft);height:70px;white-space:normal;}
  table.bk-table td.bk-empty.err{color:var(--a-bad-tx);}
  .bk-pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 2px 0;color:var(--a-text-soft);font-size:13px;}
  /* badges (variante sólida suave) */
  .bdg{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:30px;border:1px solid transparent;}
  .bdg-ok{background:var(--a-ok-bg);color:var(--a-ok-tx);border-color:var(--a-ok-bd);}
  .bdg-warn{background:var(--a-pend-bg);color:var(--a-pend-tx);border-color:var(--a-pend-bd);}
  .bdg-bad{background:var(--a-bad-bg);color:var(--a-bad-tx);border-color:var(--a-bad-bd);}
  .bdg-info{background:var(--a-info-bg);color:var(--a-info-tx);border-color:var(--a-info-bd);}
  .bdg-muted{background:var(--a-mut-bg);color:var(--a-mut-tx);border-color:var(--a-mut-bd);}
  /* detalle */
  .bk-modal{position:fixed;inset:0;z-index:1500;background:rgba(8,32,31,.55);display:flex;align-items:center;justify-content:center;
    padding:20px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;}
  .bk-modal.open{opacity:1;visibility:visible;}
  .bk-modal-card{position:relative;width:100%;max-width:580px;max-height:88vh;overflow:auto;background:var(--a-card);
    border:1px solid var(--a-border);border-radius:16px;padding:26px 24px;box-shadow:var(--shadow);}
  .bk-modal-x{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;background:var(--a-mut-bg);
    color:var(--a-text);font-size:22px;line-height:1;border:1px solid var(--a-border);}
  .bk-modal-x:hover{background:rgba(17,48,47,.12);}
  .bk-modal-body h3{color:var(--a-text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;margin-bottom:16px;}
  .bk-dls{display:grid;grid-template-columns:1fr 1fr;gap:12px 18px;}
  .bk-dl{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .bk-dl span{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--a-text-mut);}
  .bk-dl b{font-weight:600;font-size:13.5px;color:var(--a-text);word-break:break-word;}
  .bk-dl a{color:var(--a-info-tx);}
  .bk-modal-actions{display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--a-border);flex-wrap:wrap;}
  .bk-modal-actions select{padding:9px 12px;border-radius:8px;background-color:var(--a-card-2);color:var(--a-text);
    border:1.5px solid var(--a-border);font-family:var(--body);}
  .bk-modal-actions select:focus{outline:none;border-color:var(--a-gold);box-shadow:0 0 0 3px rgba(207,159,84,.18);}
  .bk-modal-actions select option{background-color:var(--a-card-2);color:var(--a-text);}
  .bk-modal-actions select option:checked{background-color:var(--a-bg-2);color:var(--a-text);}
  /* ---------- Finanzas: pestañas (Fase 9-3) ---------- */
  .fin-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--a-border);padding-bottom:10px;}
  .fin-tab{font-size:13.5px;font-weight:700;padding:8px 14px;border-radius:9px;background:transparent;color:var(--a-text-soft);border:1px solid transparent;cursor:pointer;transition:.2s;}
  .fin-tab:hover{background:var(--a-bg-2);color:var(--a-text);}
  .fin-tab.on{background:var(--a-gold);color:var(--a-sidebar-2);border-color:var(--a-gold);}
  /* ---------- Fase 9 final: permisos, ventas, comunicaciones ---------- */
  /* Aviso de solo lectura: informativo, no alarma — por eso no es rojo. */
  .ro-note{background:var(--a-bg-2);border:1px solid var(--a-border);border-left:3px solid var(--a-gold);
           color:var(--a-text-soft);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:600;margin:10px 0;}
  .sales-head{display:flex;flex-direction:column;align-items:flex-start;gap:10px;}
  .sales-head .btn{align-self:flex-start;}
  /* Cadencia de recordatorios */
  .rem-stages{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;}
  .rem-stage{display:flex;align-items:center;gap:10px;background:var(--a-card-2);border:1px solid var(--a-border);
             border-radius:10px;padding:8px 12px;font-size:13px;color:var(--a-text);}
  .rem-stage b{color:var(--a-sidebar);background:var(--a-gold);border-radius:6px;padding:2px 8px;font-size:12px;}
  /* Bloques de la sección Comunicaciones y documentos */
  .bk-block{border:1px solid var(--a-border);border-radius:12px;background:var(--a-card-2);padding:12px 14px;margin:10px 0;}
  .bk-block-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;
                 color:var(--a-text);font-size:14px;}
  .bk-doc-row,.bk-log-row{display:flex;align-items:center;flex-wrap:wrap;gap:8px;padding:7px 0;
                          border-bottom:1px solid var(--a-border);font-size:13px;color:var(--a-text);}
  .bk-doc-row:last-child,.bk-log-row:last-child{border-bottom:0;}
  .bk-doc-row a{color:var(--a-text);font-weight:700;text-decoration:underline;}
  .bk-add{margin-top:10px;}
  .bk-add summary{cursor:pointer;font-weight:700;font-size:13px;color:var(--a-text-soft);padding:6px 0;}
  .bk-add summary:hover{color:var(--a-text);}
  .bk-doc-name{color:var(--a-text);font-size:13.5px;}
  .bk-doc-meta{color:var(--a-text-soft);font-size:11.5px;}
  input[type=file]{font-size:12.5px;color:var(--a-text-soft);}
  /* Barra de progreso de subida (dorada sobre arena). */
  .up-progress{height:8px;border-radius:6px;background:var(--a-bg-2);border:1px solid var(--a-border);overflow:hidden;margin:8px 0;}
  .up-progress > i{display:block;height:100%;width:0;background:var(--a-gold);transition:width .15s ease;}
  /* ---------- Dashboard (Fase 9) ---------- */
  .dash-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:4px;}
  .dash-card{background:var(--a-card);border:1px solid var(--a-border);border-radius:14px;padding:18px 20px;box-shadow:var(--a-shadow-sm);}
  .dash-card h3{color:var(--a-text);font-size:16px;margin-bottom:12px;font-family:var(--body);font-weight:700;}
  .dash-list{display:flex;flex-direction:column;}
  .dash-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--a-border);}
  .dash-row:last-child{border-bottom:0;}
  .dash-row .who{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .dash-row .who b{color:var(--a-text);font-size:13.5px;font-weight:700;}
  .dash-row .who small{color:var(--a-text-soft);font-size:12px;}
  .dash-bars{display:flex;align-items:flex-end;gap:10px;min-height:170px;padding-top:8px;}
  .dash-bar{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;justify-content:flex-end;}
  .dash-bar .bar{width:100%;max-width:46px;background:var(--a-sidebar);border-radius:6px 6px 0 0;min-height:3px;}
  .dash-bar .bar.cur{background:var(--a-gold);}
  .dash-bar .amt{font-size:10.5px;color:var(--a-text-soft);font-weight:700;white-space:nowrap;}
  .dash-bar .mo{font-size:10.5px;color:var(--a-text-mut);text-transform:capitalize;}
  .dash-alert{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--a-pend-bd);background:var(--a-pend-bg);color:var(--a-pend-tx);font-size:13.5px;font-weight:600;margin-bottom:8px;}
  .dash-alert:last-child{margin-bottom:0;}
  .dash-alert.ok{border-color:var(--a-ok-bd);background:var(--a-ok-bg);color:var(--a-ok-tx);}
  .dash-empty{color:var(--a-text-soft);font-size:13px;padding:6px 0;}
  @media(max-width:980px){
    .bk-frow,.bk-frow:first-child{grid-template-columns:1fr 1fr;}
    .bk-cal-day{min-height:58px;}
    .dash-cols{grid-template-columns:1fr;}
  }
  @media(max-width:760px){
    .admin-body{grid-template-columns:1fr;}
    .admin-nav{position:static;min-height:auto;flex-direction:row;flex-wrap:wrap;}
    .admin-nav button{width:auto;}
    .ed-row{grid-template-columns:1fr;}
    .bk-frow,.bk-frow:first-child{grid-template-columns:1fr;}
    .bk-cal{padding:12px;}
    .bk-cal-grid,.bk-cal-dow{gap:3px;}
    .bk-cal-day{min-height:46px;padding:4px;}
    .bk-cal-day .c{font-size:9px;}
    /* En pantallas pequeñas SÍ se permite scroll horizontal: la tabla recupera
       un ancho mínimo legible y el contenedor desplaza. */
    .bk-table-wrap{max-height:none;overflow-x:auto;}
    table.bk-table{table-layout:auto;min-width:760px;}
    .bk-dls{grid-template-columns:1fr;}
    .bk-modal{padding:0;}
    .bk-modal-card{max-width:none;max-height:100vh;height:100vh;border-radius:0;}
  }
</style>
