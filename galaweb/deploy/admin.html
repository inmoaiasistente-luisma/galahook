<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- El acceso admin se protege con el login seguro (sesión server-side); no se usa el gate ghk_lock. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Galápagos Hook Adventure</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="stylesheet" href="assets/css/site.css">
<style>
  body{background:#0c2322;}
  .admin-shell{min-height:100vh;display:flex;flex-direction:column;}
  /* login */
  .login{min-height:100vh;display:grid;place-items:center;padding:24px;
    background:linear-gradient(rgba(8,32,31,.82),rgba(8,32,31,.92)),url(assets/img/kicker-sunrise.jpg);background-size:cover;background-position:center;}
  .login-card{width:100%;max-width:400px;background:var(--paper);border-radius:14px;padding:40px 34px;box-shadow:var(--shadow);}
  .login-card img{height:84px;margin:0 auto 18px;display:block;}
  .login-card h1{font-size:24px;text-align:center;margin-bottom:6px;}
  .login-card p{text-align:center;color:var(--ink-soft);font-size:14px;margin-bottom:24px;}
  .err{background:#fbe7e3;color:#9a2b16;border-radius:6px;padding:10px 14px;font-size:13.5px;margin-bottom:14px;display:none;}
  .err.show{display:block;}
  /* topbar */
  .admin-top{position:sticky;top:0;z-index:50;background:var(--deep);color:var(--paper);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 22px;box-shadow:0 1px 0 var(--line-on-dark);}
  .admin-top .brand-mini{display:flex;align-items:center;gap:11px;}
  .admin-top img{height:36px;}
  .admin-top b{font-family:var(--display);font-weight:800;font-size:15px;}
  .admin-top .actions{display:flex;gap:10px;align-items:center;}
  .save-state{font-size:12.5px;color:var(--gold-soft);opacity:0;transition:.3s;}
  .save-state.show{opacity:1;}
  /* layout */
  .admin-body{flex:1;display:grid;grid-template-columns:230px 1fr;align-items:start;}
  .admin-nav{position:sticky;top:60px;background:var(--deep-2);min-height:calc(100vh - 60px);padding:22px 14px;display:flex;flex-direction:column;gap:3px;}
  .admin-nav button{display:flex;align-items:center;gap:11px;text-align:left;color:rgba(255,255,255,.72);font-family:var(--body);font-weight:600;font-size:14.5px;padding:11px 14px;border-radius:8px;transition:.25s;width:100%;}
  .admin-nav button:hover{background:rgba(255,255,255,.06);color:#fff;}
  .admin-nav button.active{background:var(--gold);color:var(--deep);}
  .admin-main{padding:34px clamp(20px,4vw,52px);max-width:1000px;}
  .panel{display:none;}
  .panel.active{display:block;}
  .panel-anim{animation:fade .4s var(--ease) both;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .panel h2{font-size:30px;margin-bottom:6px;color:var(--paper);}
  .admin-main h2{color:var(--paper);}
  .panel .sub{color:rgba(255,255,255,.6);margin-bottom:28px;font-size:15px;}
  /* cards & fields (dark) */
  .ed-card{background:rgba(255,255,255,.04);border:1px solid var(--line-on-dark);border-radius:12px;padding:24px;margin-bottom:20px;}
  .ed-card h3{color:var(--paper);font-family:var(--body);font-weight:700;font-size:17px;margin-bottom:4px;display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .ed-card .hint{color:rgba(255,255,255,.5);font-size:13px;margin-bottom:16px;}
  .ed-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .ed-field{margin-bottom:14px;}
  .ed-field label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:6px;}
  .ed-field input,.ed-field textarea,.ed-field select{width:100%;padding:11px 13px;border:1.5px solid var(--line-on-dark);border-radius:7px;background:rgba(255,255,255,.07);color:var(--paper);font-family:var(--body);font-size:14.5px;}
  /* Los <select> van con fondo OPACO oscuro: en Windows el popup translúcido
     salía blanco sobre blanco. El option/checked/disabled se estilan en site.css. */
  .ed-field select{background-color:#0c2a28;background-image:none;}
  .ed-field input:focus,.ed-field textarea:focus,.ed-field select:focus{outline:none;border-color:var(--gold);}
  .ed-field select:disabled{opacity:.72;color:var(--paper);}
  .ed-field select option{background-color:#0c2a28;color:var(--paper);}
  .ed-field ::placeholder{color:rgba(251,248,241,.6);}
  .ed-field textarea{resize:vertical;min-height:72px;}
  .price-in{display:flex;align-items:center;gap:8px;}
  .price-in span{color:var(--gold-soft);font-weight:700;}
  .img-edit{display:flex;gap:14px;align-items:center;}
  .img-edit .thumb{width:96px;height:72px;border-radius:7px;object-fit:cover;background:#0c2322 center/cover;flex-shrink:0;border:1px solid var(--line-on-dark);}
  .img-edit .img-actions{flex:1;display:flex;flex-direction:column;gap:8px;}
  .mini-btn{font-size:12.5px;font-weight:700;letter-spacing:.04em;padding:8px 14px;border-radius:6px;background:rgba(255,255,255,.1);color:var(--paper);transition:.25s;cursor:pointer;display:inline-flex;align-items:center;gap:7px;}
  .mini-btn:hover{background:rgba(255,255,255,.18);}
  .mini-btn.danger{background:rgba(200,70,50,.22);color:#ffb3a3;}
  .mini-btn.danger:hover{background:rgba(200,70,50,.35);}
  .lang-mini{display:inline-flex;border:1px solid var(--line-on-dark);border-radius:6px;overflow:hidden;}
  .lang-mini button{font-size:12px;font-weight:800;letter-spacing:.05em;padding:7px 11px;background:transparent;color:rgba(255,255,255,.6);cursor:pointer;transition:.2s;border:0;line-height:1;}
  .lang-mini button:hover{color:var(--paper);background:rgba(255,255,255,.08);}
  .lang-mini button.on{background:var(--gold);color:var(--deep);}
  .lang-mini button.on:hover{background:var(--gold);}
  .list-item{position:relative;}
  .item-head{display:flex;align-items:center;justify-content:space-between;gap:12px;cursor:pointer;}
  .add-btn{width:100%;border:1.5px dashed var(--line-on-dark);border-radius:10px;padding:16px;color:var(--gold-soft);font-weight:700;letter-spacing:.04em;transition:.25s;}
  .add-btn:hover{background:rgba(255,255,255,.05);border-color:var(--gold);}
  .inc-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .inc-row input{flex:1;}
  /* ---------- Reservas: resumen, calendario, tabla, detalle ---------- */
  .bk-sum{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
  .bk-chip{display:inline-flex;align-items:baseline;gap:7px;background:rgba(255,255,255,.05);border:1px solid var(--line-on-dark);
    border-radius:30px;padding:6px 14px;font-size:13px;color:rgba(255,255,255,.75);}
  .bk-chip i{font-style:normal;opacity:.6;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;}
  .bk-chip b{color:var(--gold-soft);font-size:14px;}
  /* tira financiera (solo owner/admin) */
  .bk-fin{align-items:center;padding:10px 12px;border:1px solid rgba(207,159,84,.32);border-radius:12px;
    background:rgba(207,159,84,.07);margin-bottom:16px;}
  .bk-fin:empty{display:none;}
  .bk-fin-lab{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--gold-soft);
    align-self:center;margin-right:4px;}
  .bk-meth{font-size:10px;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.04em;}
  /* ---- Módulo Finanzas ---- */
  .fin-filters{margin-bottom:14px;}
  .fin-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px;}
  .fin-tile{background:rgba(255,255,255,.05);border:1px solid var(--line-on-dark);border-radius:10px;padding:12px 14px;display:flex;flex-direction:column;gap:4px;}
  .fin-tile span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:rgba(255,255,255,.55);}
  .fin-tile b{font-size:19px;color:var(--paper);}
  .fin-tile.strong{border-color:rgba(207,159,84,.4);background:rgba(207,159,84,.09);}
  .fin-tile.strong b{color:var(--gold-soft);}
  .fin-tile.warn b{color:#e4c98c;}
  .fin-partial{background:rgba(207,159,84,.12);border:1px solid rgba(207,159,84,.35);color:#e4c98c;border-radius:8px;padding:9px 12px;font-size:13px;font-weight:600;margin-bottom:14px;}
  .fin-sec{margin-top:26px;}
  .fin-sec h3{color:var(--paper);font-size:18px;margin-bottom:4px;}
  .fin-sec h4{color:var(--paper);font-size:15px;margin:14px 0 8px;}
  .fin-tourtable{margin-top:4px;}
  .bk-form-err{color:#ffb3a3;font-size:13px;}
  /* ---- Lote 4: badges de estado (notificaciones) + datos de prueba ---- */
  .notif-badge{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.03em;padding:3px 9px;border-radius:999px;text-transform:uppercase;line-height:1.4;border:1px solid transparent;}
  .notif-sent{background:rgba(31,138,91,.22);color:#8fe3b6;border-color:rgba(31,138,91,.5);}
  .notif-failed{background:rgba(200,70,50,.24);color:#ffb3a3;border-color:rgba(200,70,50,.5);}
  .notif-pending{background:rgba(207,159,84,.2);color:#f0d29a;border-color:rgba(207,159,84,.5);}
  .notif-sending{background:rgba(70,120,200,.24);color:#a9c8ff;border-color:rgba(70,120,200,.5);}
  .notif-skipped{background:rgba(255,255,255,.1);color:rgba(255,255,255,.7);border-color:rgba(255,255,255,.25);}
  .notif-test{background:rgba(207,159,84,.2);color:#f0d29a;border-color:rgba(207,159,84,.5);}
  .notif-archived{background:rgba(255,255,255,.09);color:rgba(255,255,255,.55);border-color:rgba(255,255,255,.2);}
  .td-hint{color:rgba(255,255,255,.6);font-size:13.5px;margin-bottom:12px;}
  .td-warn{line-height:1.5;}
  .td-danger{background:rgba(200,70,50,.3);}
  .td-danger:hover{background:rgba(200,70,50,.45);}
  .bk-table tr.td-arch td{opacity:.55;}
  .nf-actions{display:flex;gap:6px;flex-wrap:wrap;}
  /* bloques QR y notificaciones en el detalle (owner/admin) */
  .bk-sub{margin-top:20px;padding-top:16px;border-top:1px solid var(--line-on-dark);}
  .bk-sub h4{color:var(--paper);font-family:var(--body);font-weight:700;font-size:14px;margin-bottom:4px;}
  .bk-sub-hint{color:rgba(255,255,255,.5);font-size:12.5px;line-height:1.5;margin-bottom:12px;}
  .bk-sub-acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px;}
  .bk-sub-msg{font-size:12.5px;line-height:1.5;margin-top:10px;}
  .bk-sub-msg.warn{color:#e4c98c;} .bk-sub-msg.err{color:#ffb3a3;}
  .bk-qr-img{text-align:center;}
  .bk-qr-img img{width:190px;max-width:60%;height:auto;background:#fff;border-radius:10px;padding:8px;}
  .bk-qr-url{font-size:10.5px;color:rgba(255,255,255,.45);word-break:break-all;margin-top:8px;}
  .bk-notifs{display:flex;flex-direction:column;gap:8px;}
  .bk-notif{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:rgba(255,255,255,.04);
    border:1px solid var(--line-on-dark);border-radius:8px;padding:10px 12px;}
  .bk-notif-main{flex:1;min-width:150px;display:flex;flex-direction:column;gap:2px;}
  .bk-notif-main b{font-size:12.5px;color:var(--paper);font-weight:700;word-break:break-word;}
  .bk-notif-main small{font-size:11px;color:rgba(255,255,255,.5);}
  /* calendario */
  .bk-cal{background:rgba(255,255,255,.04);border:1px solid var(--line-on-dark);border-radius:12px;padding:16px;margin-bottom:18px;}
  .bk-cal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .bk-cal-title{color:var(--paper);font-family:var(--display);font-size:18px;text-transform:capitalize;}
  .bk-cal-nav{display:flex;gap:6px;}
  .bk-cal-dow,.bk-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;}
  .bk-cal-dow{margin-bottom:5px;}
  .bk-cal-dow span{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.42);}
  .bk-cal-day{display:flex;flex-direction:column;align-items:flex-start;gap:1px;min-height:66px;padding:6px 7px;border-radius:8px;
    background:rgba(255,255,255,.03);border:1px solid transparent;color:rgba(255,255,255,.8);text-align:left;transition:.18s;cursor:pointer;overflow:hidden;}
  .bk-cal-day:hover{background:rgba(255,255,255,.09);}
  .bk-cal-day .d{font-weight:700;font-size:13px;color:var(--paper);}
  .bk-cal-day .c{font-size:10.5px;line-height:1.25;color:var(--gold-soft);white-space:nowrap;}
  .bk-cal-day .c.q{color:rgba(160,190,255,.85);}
  .bk-cal-day.out{opacity:.32;}
  .bk-cal-day.today{border-color:var(--gold);}
  .bk-cal-day.sel{background:var(--gold);border-color:var(--gold);}
  .bk-cal-day.sel .d,.bk-cal-day.sel .c{color:var(--deep);}
  /* filtros */
  .bk-filters{background:rgba(255,255,255,.04);border:1px solid var(--line-on-dark);border-radius:12px;padding:16px 16px 6px;margin-bottom:14px;}
  .bk-frow{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
  .bk-frow:first-child{grid-template-columns:2fr 1fr 1fr;}
  .bk-fbtns{display:flex;gap:8px;flex-wrap:wrap;padding-bottom:12px;}
  .bk-tbl-title{color:var(--paper);font-family:var(--display);font-weight:700;font-size:16px;margin:0 2px 10px;text-transform:capitalize;}
  /* tabla compacta */
  .bk-table-wrap{border:1px solid var(--line-on-dark);border-radius:12px;overflow:auto;max-height:62vh;background:rgba(255,255,255,.03);}
  table.bk-table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:820px;}
  table.bk-table thead th{position:sticky;top:0;z-index:2;background:#12302e;color:rgba(255,255,255,.62);
    font-weight:700;font-size:11px;letter-spacing:.07em;text-transform:uppercase;text-align:left;padding:10px 12px;white-space:nowrap;
    border-bottom:1px solid var(--line-on-dark);}
  table.bk-table tbody td{padding:0 12px;height:46px;color:rgba(255,255,255,.86);border-bottom:1px solid rgba(255,255,255,.06);white-space:nowrap;}
  table.bk-table tbody tr:nth-child(even){background:rgba(255,255,255,.025);}
  table.bk-table tbody tr:hover{background:rgba(255,255,255,.07);cursor:pointer;}
  table.bk-table td.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;color:var(--gold-soft);}
  table.bk-table td.num{text-align:right;}
  table.bk-table td.ell{max-width:190px;overflow:hidden;text-overflow:ellipsis;}
  table.bk-table td.bk-empty{text-align:center;color:rgba(255,255,255,.5);height:70px;white-space:normal;}
  table.bk-table td.bk-empty.err{color:#ffb3a3;}
  .bk-pager{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 2px 0;color:rgba(255,255,255,.7);font-size:13px;}
  /* badges */
  .bdg{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:3px 9px;border-radius:30px;}
  .bdg-ok{background:#1f8a5b;color:#fff;}
  .bdg-warn{background:rgba(207,159,84,.28);color:#e4c98c;}
  .bdg-bad{background:rgba(200,70,50,.28);color:#ffb3a3;}
  .bdg-info{background:rgba(90,140,220,.26);color:#bcd4ff;}
  .bdg-muted{background:rgba(255,255,255,.13);color:rgba(255,255,255,.78);}
  /* detalle */
  .bk-modal{position:fixed;inset:0;z-index:1500;background:rgba(4,18,17,.72);display:flex;align-items:center;justify-content:center;
    padding:20px;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s;}
  .bk-modal.open{opacity:1;visibility:visible;}
  .bk-modal-card{position:relative;width:100%;max-width:560px;max-height:88vh;overflow:auto;background:#0f2a28;
    border:1px solid var(--line-on-dark);border-radius:14px;padding:26px 24px;box-shadow:var(--shadow);}
  .bk-modal-x{position:absolute;top:10px;right:12px;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.12);
    color:#fff;font-size:22px;line-height:1;}
  .bk-modal-body h3{color:var(--gold-soft);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:15px;margin-bottom:16px;}
  .bk-dls{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;}
  .bk-dl{display:flex;flex-direction:column;gap:2px;min-width:0;}
  .bk-dl span{font-size:10.5px;letter-spacing:.07em;text-transform:uppercase;color:rgba(255,255,255,.45);}
  .bk-dl b{font-weight:600;font-size:13.5px;color:rgba(255,255,255,.9);word-break:break-word;}
  .bk-dl a{color:#e4c98c;}
  .bk-modal-actions{display:flex;gap:10px;align-items:center;margin-top:22px;padding-top:16px;border-top:1px solid var(--line-on-dark);flex-wrap:wrap;}
  .bk-modal-actions select{padding:9px 12px;border-radius:7px;background-color:#0c2a28;color:var(--paper);
    border:1.5px solid var(--line-on-dark);font-family:var(--body);}
  /* Dropdown de booking_status: opción legible y seleccionada distinguible. */
  .bk-modal-actions select:focus{outline:none;border-color:var(--gold);}
  .bk-modal-actions select option{background-color:#0c2a28;color:var(--paper);}
  .bk-modal-actions select option:checked{background-color:#20514c;color:#fff;}
  @media(max-width:980px){
    .bk-frow,.bk-frow:first-child{grid-template-columns:1fr 1fr;}
    .bk-cal-day{min-height:58px;}
  }
  @media(max-width:760px){
    .admin-body{grid-template-columns:1fr;}
    .admin-nav{position:static;min-height:auto;flex-direction:row;flex-wrap:wrap;}
    .admin-nav button{width:auto;}
    .ed-row{grid-template-columns:1fr;}
    .bk-frow,.bk-frow:first-child{grid-template-columns:1fr;}
    .bk-cal{padding:12px;}
    .bk-cal-grid,.bk-cal-dow{gap:3px;}
    .bk-cal-day{min-height:46px;padding:4px;}
    .bk-cal-day .c{font-size:9px;}
    .bk-table-wrap{max-height:none;}
    .bk-dls{grid-template-columns:1fr;}
    .bk-modal{padding:0;}
    .bk-modal-card{max-width:none;max-height:100vh;height:100vh;border-radius:0;}
  }
</style>
</head>
<body>
<div class="admin-shell" id="shell"></div>
<script src="assets/js/content.js?v=hp6"></script>
<script src="assets/js/admin.js"></script>
</body>
</html>
