<body data-page="contact">
<header class="site-header" id="site-header"></header>

<!-- Cabecera "viva": foto nueva o la de siempre + video en bucle de Higgsfield/Kling.
     Estilos en page-hero.css, lógica en page-hero.js. Sin movimiento queda la foto quieta. -->
<section class="pagehero ph ph-contact">
  <div class="ph-stage">
    <div class="ph-media" aria-hidden="true">
      <picture>
        <source media="(max-aspect-ratio: 3/4)" srcset="assets/img/hero/contact-portrait.jpg">
        <img src="assets/img/hero/contact-1600.jpg" srcset="assets/img/hero/contact-1600.jpg 1600w, assets/img/hero/contact-2048.jpg 2048w" sizes="100vw" alt="" fetchpriority="high" decoding="async">
      </picture>
      <video class="ph-loop" muted playsinline loop preload="none" data-src="assets/video/contact-vivo"></video>
    </div>
    <div class="ph-shade"></div>
    <div class="ph-frame" aria-hidden="true"><svg><path pathLength="1"/></svg><i></i><i></i></div>
    <div class="ph-copy"><div class="wrap">
      <p class="breadcrumb"><a href="index.html" data-en="Home" data-es="Inicio">Home</a> · <span data-decode data-en="Contact" data-es="Contacto">Contact</span></p>
      <div class="ph-title"><h1 data-en="Let's plan your Galápagos" data-es="Planifiquemos tu Galápagos">Let's plan your Galápagos</h1></div>
      <p class="lead" data-en="Tell us your dates and dreams. A real local — not a call centre — will reply." data-es="Cuéntanos tus fechas y sueños. Un local de verdad — no un call center — te responderá."></p>
    </div></div>
    <div class="ph-dock">
      <button class="ph-pause" type="button" aria-pressed="false">
        <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="4" width="4" height="16" rx="1"/><rect x="14" y="4" width="4" height="16" rx="1"/></svg>
        <svg class="i-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>
        <span class="t-pause" data-en="Pause" data-es="Pausar">Pause</span><span class="t-play" data-en="Play" data-es="Reproducir">Play</span>
      </button>
      <div class="ph-cue" aria-hidden="true"><span data-en="Scroll to discover" data-es="Desliza para descubrir">Scroll to discover</span><i></i><b>00</b></div>
      <a class="ph-talk" href="#escribenos"><span data-decode data-en="Write to us below" data-es="Escríbenos aquí abajo">Write to us below</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 4v15M6 13l6 6 6-6"/></svg></a>
    </div>
  </div>
</section>

<section class="section dark" id="escribenos">
  <div class="wrap">
    <div class="contact-grid">
      <div class="reveal">
        <p class="eyebrow" data-en="Talk to a local" data-es="Habla con un local">Talk to a local</p>
        <h2 style="font-size:clamp(28px,3.6vw,42px);margin-bottom:24px" data-en="Get in touch" data-es="Contáctanos">Get in touch</h2>
        <ul class="contact-info" id="contactInfo"></ul>
        <a class="btn btn-gold" style="margin-top:26px" id="waBig" target="_blank" rel="noopener" href="#" data-en="Chat on WhatsApp" data-es="Chatea por WhatsApp">Chat on WhatsApp</a>
      </div>

      <div class="reveal">
        <form data-contact style="background:rgba(255,255,255,.05);border:1px solid var(--line-on-dark);border-radius:12px;padding:30px">
          <div class="form-row">
            <div class="field"><label data-en="Full name" data-es="Nombre completo">Full name</label><input name="name" autocomplete="name" required></div>
            <div class="field"><label data-en="Email" data-es="Correo">Email</label><input name="email" type="email" autocomplete="email" placeholder="you@email.com"></div>
          </div>
          <div class="field"><label data-en="WhatsApp / phone (optional)" data-es="WhatsApp / teléfono (opcional)">WhatsApp / phone (optional)</label><input name="phone" type="tel" autocomplete="tel" inputmode="tel" placeholder="+593…"></div>
          <div class="field"><label data-en="I'm interested in" data-es="Me interesa">I'm interested in</label>
            <select name="interest">
              <option data-en="All-inclusive package" data-es="Paquete todo incluido">All-inclusive package</option>
              <option data-en="Day tours" data-es="Tours de día">Day tours</option>
              <option data-en="Sport fishing" data-es="Pesca deportiva">Sport fishing</option>
              <option data-en="Diving" data-es="Buceo">Diving</option>
              <option data-en="Private / custom trip" data-es="Viaje privado / a medida">Private / custom trip</option>
            </select>
          </div>
          <div class="field"><label data-en="Your message" data-es="Tu mensaje">Your message</label><textarea name="message" placeholder="Dates, group size, what you'd love to see…"></textarea></div>
          <!-- honeypot: oculto para humanos; si un bot lo rellena, el envío se descarta -->
          <div class="hp-field" aria-hidden="true" style="position:absolute;left:-9999px;top:auto;width:1px;height:1px;overflow:hidden"><label>Company<input name="company" tabindex="-1" autocomplete="off"></label></div>
          <button type="submit" class="btn btn-gold btn-block" data-en="Send message" data-es="Enviar mensaje">Send message</button>
          <p style="font-size:12.5px;color:rgba(255,255,255,.5);text-align:center;margin:14px 0 0" data-en="Leave your email or WhatsApp and we'll reply — usually within a day." data-es="Déjanos tu correo o WhatsApp y te respondemos — normalmente en un día."></p>
          <p style="text-align:center;margin:12px 0 0"><a data-wa-secondary target="_blank" rel="noopener" href="#" style="color:var(--gold);font-size:13.5px;text-decoration:underline" data-en="Prefer WhatsApp? Chat with us →" data-es="¿Prefieres WhatsApp? Escríbenos →">Prefer WhatsApp? Chat with us →</a></p>
        </form>
      </div>
    </div>
  </div>
</section>

<section class="section paper-bg">
  <div class="wrap">
    <div class="sectionhead center reveal">
      <p class="eyebrow" style="justify-content:center" data-en="The Island" data-es="La Isla">The Island</p>
      <h2 data-en="Where the adventures happen" data-es="Donde ocurren las aventuras">Where the adventures happen</h2>
      <p class="lead" style="margin:16px auto 0" data-en="San Cristóbal — the easternmost island and our home. Hover the pins to explore." data-es="San Cristóbal — la isla más oriental y nuestro hogar. Pasa el cursor sobre los pines para explorar."></p>
    </div>
    <div class="map-wrap reveal" id="mapWrap"></div>
    <div class="map-legend" id="mapLegend"></div>
  </div>
</section>

<footer class="site-footer" id="site-footer"></footer>
<script src="assets/js/content.js?v=hp10"></script>
<script src="https://js.stripe.com/v3/"></script>
<script src="assets/js/payments.js"></script>
<script src="assets/js/app.js?v=hp10"></script>
<script src="assets/js/page-hero.js"></script>
<script>
  // contact info list + big WA button (after app render)
  window.addEventListener('load',function(){
    var S=window.GHA.content, L=window.GHA.lang, svg=window.GHA.svg, m=S.meta;
    var t=function(v){return v&&typeof v==='object'?(v[L]||v.en):v;};
    var ul=document.getElementById('contactInfo');
    if(ul) ul.innerHTML=
      '<li>'+svg('pin')+'<div><small>'+(L==='es'?'Galápagos (sede)':'Galápagos (HQ)')+'</small><span>'+t(m.address)+'</span></div></li>'
     +'<li>'+svg('pin')+'<div><small>'+(L==='es'?'Oficina EE. UU.':'USA Office')+'</small><span>'+t(m.addressUs)+'</span></div></li>'
     +'<li>'+svg('wa')+'<div><small>WhatsApp</small><span>+'+m.whatsapp+'</span></div></li>'
     +'<li>'+svg('phone')+'<div><small>'+(L==='es'?'Teléfono':'Phone')+'</small><span>'+m.phone+'</span></div></li>'
     +'<li>'+svg('mail')+'<div><small>Email</small><span>'+m.email+'</span></div></li>'
     +'<li>'+svg('clock')+'<div><small>'+(L==='es'?'Horario':'Hours')+'</small><span>'+t(m.hours)+'</span></div></li>';
    var wa=document.getElementById('waBig');
    if(wa) wa.href='https://wa.me/'+(m.whatsapp||'').replace(/\D/g,'')+'?text='+encodeURIComponent(L==='es'?'¡Hola Galápagos Hook! Quisiera planificar un viaje.':'Hi Galápagos Hook! I would love to plan a trip.');
  });
</script>
</body>
</html>
